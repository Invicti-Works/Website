# Sveltia CMS configuration.
# Docs: https://github.com/sveltia/sveltia-cms
#
# Field names here MUST stay in sync with the Zod schemas in
# src/content.config.ts. If they drift, the site build fails with a validation
# error instead of publishing broken pages. That is deliberate.

backend:
  name: github
  repo: Invicti-Works/Website
  branch: main
  # Sign-in is handled by this site's own Worker (worker/cms-auth.js) rather
  # than a separate authentication service, so these point back at us.
  # Sveltia opens `<base_url>/<auth_endpoint>` as the sign-in popup.
  #
  # Requires the custom domain to be attached -- see docs/SETUP.md step 4 --
  # and GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET set on the Worker (step 5).
  base_url: https://invicti.works
  auth_endpoint: oauth/authorize
  # Narrower than the default `repo,user`: enough to read and commit content,
  # without handing the token access to an editor's private repositories.
  auth_scope: public_repo

media_folder: public/uploads
public_folder: /uploads

site_url: https://invicti.works

collections:
  # ---------------------------------------------------------------
  # Team -- shown at the foot of the home page
  # ---------------------------------------------------------------
  - name: team
    label: Team
    label_singular: Person
    folder: src/content/team
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    identifier_field: name
    summary: '{{name}} — {{role}}'
    sortable_fields: ['order', 'name']
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: summary, label: One-line summary, widget: string }
      - name: image
        label: Headshot
        widget: image
        required: false
        hint: >-
          Square photo. No alt text needed -- the name is shown right next to it,
          so the image is marked decorative for screen readers.
      - name: order
        label: Sort order
        widget: number
        value_type: int
        default: 100
      - name: links
        label: Links
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - { name: github, label: GitHub URL, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Bio, widget: markdown }

  # ---------------------------------------------------------------
  # Site settings
  # ---------------------------------------------------------------
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Company details
        file: src/data/site.json
        description: >-
          Name, tagline, contact details and social links. These appear in the
          header, footer, contact page and search-engine listings.
        fields:
          - { name: name, label: Company name, widget: string }
          - { name: shortName, label: Short name, widget: string }
          - name: tagline
            label: Tagline
            widget: string
            hint: One short line. Used as the home-page headline.
          - name: description
            label: Description
            widget: text
            hint: Two sentences. Used by Google and for social sharing previews.
          - name: url
            label: Site URL
            widget: string
            pattern: ['^https://', 'Must start with https://']
          - { name: locale, label: Locale, widget: string, default: en_US }
          - { name: email, label: Email, widget: string }
          - { name: phone, label: Phone, widget: string, required: false }
          - name: address
            label: Address
            widget: object
            collapsed: true
            fields:
              - { name: street, label: Street, widget: string, required: false }
              - { name: city, label: City, widget: string, required: false }
              - { name: region, label: State / region, widget: string, required: false }
              - { name: postalCode, label: Postal code, widget: string, required: false }
              - { name: country, label: Country code, widget: string, default: US, required: false }
          - name: social
            label: Social links
            widget: object
            collapsed: true
            fields:
              - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
              - { name: facebook, label: Facebook URL, widget: string, required: false }
              - { name: instagram, label: Instagram URL, widget: string, required: false }
              - { name: pinterest, label: Pinterest URL, widget: string, required: false }
              - { name: github, label: GitHub URL, widget: string, required: false }
              - { name: x, label: X URL, widget: string, required: false }
              - { name: youtube, label: YouTube URL, widget: string, required: false }
          - name: organizationType
            label: Organization type
            widget: select
            options: ['Organization', 'Corporation', 'LocalBusiness']
            default: Organization
          - { name: founded, label: Founded, widget: string, required: false }
          - { name: ein, label: Registration number, widget: string, required: false }
