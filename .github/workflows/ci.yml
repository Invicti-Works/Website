name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when the branch gets a newer push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Also validates every content file against the schemas in
        # src/content.config.ts, so bad CMS output fails here, not in production.
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate Cloudflare configuration
        # Parses wrangler.jsonc and confirms dist/ is a deployable asset
        # directory. Runs without credentials, so no secrets are needed here --
        # the real deploy is done by Cloudflare Workers Builds on push to main.
        run: npx wrangler deploy --dry-run
